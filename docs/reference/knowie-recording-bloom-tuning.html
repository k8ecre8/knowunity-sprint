<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explain out loud: bloom, tuning</title>
<style>
  :root {
    --page: #090C18; --surface: #22242F; --input: #1A1C26; --text: #F4F2FF; --text-2: #F5F3FFAD; --text-3: #F5F3FF7A;
    --secondary: #FFFFFF1A; --border: #FFFFFF1A; --v950: #0E0A18; --v500: #9178E6;
    --exit: cubic-bezier(.4,0,1,1); --amp: 0;
    font-family: -apple-system, "SF Pro", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #05070F; color: var(--text); }
  header { position: sticky; top: 0; z-index: 5; background: #05070Fdd; backdrop-filter: blur(10px); padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; font-weight: 600; margin: 0 24px 0 0; }
  label { font-size: 14px; color: var(--text-2); display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  select, .btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; cursor: pointer; }
  input[type=range] { accent-color: var(--v500); width: 140px; }
  .meter { width: 120px; height: 6px; border-radius: 3px; background: var(--input); overflow: hidden; }
  .meter i { display: block; height: 100%; width: calc(var(--amp) * 100%); background: var(--v500); }

  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(390px, 1fr)); gap: 24px; padding: 24px; }
  .card { display: flex; flex-direction: column; gap: 12px; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; }
  .card h2 .btn { margin-left: auto; padding: 3px 9px; font-size: 13px; }
  .card p { margin: 0; font-size: 14px; line-height: 20px; color: var(--text-2); max-width: 60ch; }
  .controls { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--text-2); background: var(--input); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; width: 390px; }
  .controls output { color: var(--text-3); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }

  .screen { width: 390px; height: 320px; background: var(--page); border-radius: 24px; border: 1px solid var(--border); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 44px; overflow: hidden; }
  .hint { font-size: 15px; color: var(--text-2); margin-bottom: 18px; height: 20px; }
  .row { display: flex; align-items: center; gap: 36px; }
  .small { width: 48px; height: 48px; border-radius: 9999px; border: 0; display: grid; place-items: center; cursor: pointer; background: var(--secondary); color: var(--text); }
  .small svg { width: 22px; height: 22px; }
  .rec { position: relative; display: grid; place-items: center; cursor: pointer; border: 0; background: none; padding: 0; }
  .rec > * { grid-area: 1 / 1; }
  .shape { overflow: visible; }
  .word { z-index: 3; pointer-events: none; font-weight: 600; letter-spacing: .01em; color: var(--v950); text-align: center; }
  .sent .rec { pointer-events: none; }
  .sent .rec > * { transition: transform 250ms var(--exit), opacity 250ms var(--exit); transform: scale(.2) translateY(-60px) !important; opacity: 0; }
  .sent .small { opacity: .3; pointer-events: none; }
  .rm *, .rm *::before, .rm *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body>
<header>
  <h1>Bloom, turning gradient: tuning</h1>
  <label>Voice input <select id="src"><option value="sim">Simulated speech</option><option value="mic">My microphone</option><option value="silent">Silence</option></select></label>
  <div class="meter"><i></i></div>
  <label>Word in the disc <select id="word"><option>Tap to send</option><option>Listening</option><option>Recording</option><option value="">None</option></select></label>
  <label><input type="checkbox" id="rm"> Reduced motion</label>
  <button class="btn" id="resetAll">Reset all</button>
</header>
<main id="grid"></main>

<template id="icons">
  <svg class="trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v7M14 10v7"/></svg>
</template>

<script>
let amp = 0, target = 0, mode = 'sim', analyser = null, buf = null;
const rmBox = document.getElementById('rm'); rmBox.checked = matchMedia('(prefers-reduced-motion: reduce)').matches;
const applyRm = () => document.body.classList.toggle('rm', rmBox.checked); rmBox.addEventListener('change', applyRm); applyRm();
/* speech simulator: a stream of words, fillers and pauses with varied length, pace and loudness,
   plus a long thinking pause now and then. Nothing repeats on a fixed period. */
const rnd = (a, b) => a + Math.random() * (b - a);
let seg = null, segT = 0, sinceThink = 0;
function nextSeg() {
  sinceThink += seg ? seg.dur : 0;
  if (sinceThink > rnd(14, 26)) { sinceThink = 0; return { kind: 'pause', dur: rnd(2.5, 5) }; }        // stopped to think
  if (seg && seg.kind !== 'pause') {
    const r = Math.random();
    if (r < .62) return { kind: 'pause', dur: rnd(.05, .22) };                                        // gap between words
    if (r < .9) return { kind: 'pause', dur: rnd(.5, 1.6) };                                          // end of a phrase
    return { kind: 'filler', dur: rnd(.4, .9), peak: rnd(.28, .42) };                                 // "um"
  }
  const syl = Math.random() < .5 ? 1 : Math.random() < .6 ? 2 : Math.floor(rnd(3, 5));
  return { kind: 'word', dur: syl * rnd(.12, .24), syl, peak: rnd(.45, 1), rate: rnd(.85, 1.15) };
}
function simAmp(dt) {
  if (!seg || segT >= seg.dur) { seg = nextSeg(); segT = 0; }
  segT += dt; const u = Math.min(1, segT / seg.dur);
  if (seg.kind === 'pause') return 0;
  if (seg.kind === 'filler') return seg.peak * Math.max(0, Math.sin(u * Math.PI)) ** .6;
  const sylPos = (u * seg.syl * seg.rate) % 1;                                                        // bump per syllable
  const bump = Math.max(0, Math.sin(sylPos * Math.PI)) ** .8;
  const tail = u > .8 ? (1 - u) / .2 : 1;                                                             // words trail off
  return seg.peak * (.35 + .65 * bump) * tail;
}
document.getElementById('src').addEventListener('change', async e => { mode = e.target.value;
  if (mode === 'mic' && !analyser) { try { const st = await navigator.mediaDevices.getUserMedia({ audio: true }); const ctx = new AudioContext(); analyser = ctx.createAnalyser(); analyser.fftSize = 512; ctx.createMediaStreamSource(st).connect(analyser); buf = new Uint8Array(analyser.fftSize); }
  catch (err) { alert('Mic not available: ' + err.message); e.target.value = mode = 'sim'; } } });
function micAmp() { analyser.getByteTimeDomainData(buf); let s = 0; for (const v of buf) { const d = (v - 128) / 128; s += d * d; } return Math.min(1, Math.sqrt(s / buf.length) * 6); }

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
const V500 = '#9178E6', V300 = '#A78BFA', V400 = '#7B65E0', V100 = '#E4E0FF', BLUE = '#5FA0FC';
const NS = 'http://www.w3.org/2000/svg';
const icons = document.getElementById('icons').content, ic = n => icons.querySelector('.' + n).cloneNode(true);
const concepts = []; const wordSel = document.getElementById('word');

function closedPath(pts) { const n = pts.length; let d = ''; for (let i = 0; i < n; i++) { const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
  const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
  d += (i ? '' : `M${p1[0]} ${p1[1]}`) + ` C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${p2[0]} ${p2[1]}`; } return d + 'Z'; }

/* one builder, parameterised. P is a live object of settings. */
function bloomCard(title, note, P, withControls) {
  const el = document.createElement('section'); el.className = 'card';
  el.innerHTML = `<h2>${title}<button class="btn reset">Reset</button></h2>
    <div class="screen"><div class="hint"></div><div class="row">
      <button class="small" aria-label="Discard"></button>
      <button class="rec" aria-label="Send answer"><svg class="shape" viewBox="0 0 120 120"></svg><div class="word"></div></button>
      <div style="width:48px"></div>
    </div></div>${withControls ? '<div class="controls"></div>' : ''}<p>${note}</p>`;
  el.querySelector('.small').append(ic('trash'));
  const rec = el.querySelector('.rec'), s = el.querySelector('.shape'), word = el.querySelector('.word'), hint = el.querySelector('.hint');
  const id = 'g' + Math.random().toString(36).slice(2);
  s.innerHTML = `<defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="120"><stop offset="0%" class="a"/><stop offset="100%" class="b"/></linearGradient></defs><path fill="url(#${id})"/>`;
  const p = s.querySelector('path'), g = s.querySelector('linearGradient'), sa = s.querySelector('.a'), sb = s.querySelector('.b');
  const c = { el, sent: false }; let ang = 0, lt = 0, lvl = 0;
  c.setWord = () => { word.textContent = wordSel.value; hint.textContent = c.sent ? 'Sent. Knowie is thinking' : (wordSel.value === 'Tap to send' ? 'Listening' : 'Tap to send'); };
  rec.addEventListener('click', () => { c.sent = true; el.classList.add('sent'); c.setWord(); });
  c.reset = () => { c.sent = false; el.classList.remove('sent'); c.setWord(); };
  el.querySelector('.reset').addEventListener('click', c.reset);
  c.layout = () => { rec.style.width = rec.style.height = (P.size + 8) + 'px'; s.style.width = s.style.height = P.size + 'px';
    word.style.fontSize = P.wordSize + 'px'; word.style.lineHeight = (P.wordSize + 4) + 'px'; word.style.maxWidth = (P.size * .78) + 'px'; };
  c.update = (a, t) => { const dt = lt ? (t - lt) / 1000 : 0; lt = t; const k = P.intensity;
    ang -= dt * (20 + a * 200 * k); lvl += (a - lvl) * (a > lvl ? .5 : .06);
    const pts = [], N = 48; for (let i = 0; i < N; i++) { const th = i / N * Math.PI * 2;
      const ph1 = t / 700 + .35 * Math.sin(t / 1900), ph2 = -t / 1100 + .5 * Math.sin(t / 2700);
      const wob = 1 + .18 * Math.sin(t / 830) * Math.sin(t / 1370);                                   // slow depth wander
      const lobe = .7 * Math.cos(6 * th + ph1) + .3 * Math.cos(4 * th + ph2);
      const r = 50 * (1 + a * .1 * k) + (1.5 + a * 13 * k) * wob * lobe; pts.push([60 + Math.cos(th) * r, 60 + Math.sin(th) * r]); }
    p.setAttribute('d', closedPath(pts)); g.setAttribute('gradientTransform', `rotate(${ang} 60 60)`);
    sa.setAttribute('stop-color', mix(V400, BLUE, lvl * .6 * P.drift)); sb.setAttribute('stop-color', mix(V300, V100, lvl * .6 * P.drift));
    s.style.filter = `drop-shadow(0 0 ${12 + a * 30 * k}px ${mix(V500, BLUE, lvl * .5 * P.drift)})`; };
  if (withControls) {
    const box = el.querySelector('.controls'); const specs = [
      ['intensity', 'Motion intensity', .2, 1.2, .05], ['drift', 'Colour drift', 0, 1, .05], ['size', 'Disc size (px)', 96, 144, 8], ['wordSize', 'Word size (px)', 12, 18, 1]];
    specs.forEach(([key, lab, min, max, step]) => { const r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = P[key];
      const o = document.createElement('output'); o.textContent = P[key]; const l = document.createElement('span'); l.textContent = lab;
      r.addEventListener('input', () => { P[key] = +r.value; o.textContent = r.value; c.layout(); }); box.append(l, r, o); });
  }
  c.layout(); c.setWord(); concepts.push(c); document.getElementById('grid').append(el);
}

bloomCard('As reviewed (v3, number 5)',
 'Unchanged, for comparison. Disc 104px, word 15px, full lobe depth, full colour drift, gradient at full spin.',
 { intensity: 1, drift: 1, size: 104, wordSize: 15 }, false);

bloomCard('Tuned',
 'Starting point: disc 120px (the illustration/1500 token, the one on-token size in this range), word 15px (Body S bold), motion at 60% and colour drift at 50%. Lobes still push the edge in, so the word width is capped at 78% of the disc to keep it clear of the deepest inset. Drag the sliders to find the version you want and tell me the four numbers.',
 { intensity: .6, drift: .5, size: 120, wordSize: 15 }, true);

wordSel.addEventListener('change', () => concepts.forEach(c => c.setWord()));
document.getElementById('resetAll').addEventListener('click', () => concepts.forEach(c => c.reset()));

let last = performance.now();
function frame(t) { const dt = Math.min(.05, (t - last) / 1000); last = t;
  target = mode === 'mic' && analyser ? micAmp() : mode === 'silent' ? 0 : simAmp(dt);
  if (!Number.isFinite(target)) target = 0;
  amp += (target - amp) * (target > amp ? .5 : .12);
  document.documentElement.style.setProperty('--amp', amp.toFixed(3));
  if (!document.body.classList.contains('rm')) concepts.forEach(c => c.update(c.sent ? 0 : amp, t));
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
